<head>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            min-height: 100%;
            font-family: Arial, Helvetica, sans-serif;
        }


        body {
            background: #ffffff;
            color: #222;

            min-height: 100vh;

            display: flex;
            flex-direction: column;
        }


        /* =========================================
       TOP DIV
       ========================================= */

        .top-div {
            height: 4vh;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            border-bottom: 1px solid #ddd;
            background: #BF5845FF;
        }

        .top-column {
            display: flex;
            align-items: center;
            justify-content: center;

            
        }

        .top-column:last-child {
            border-right: none;
        }


        /* =========================================
       SOCIAL ICONS
       ========================================= */

        .social-icons {
            display: flex;
            align-items: center;
            justify-content: flex-start;

            gap: 18px;
            padding-left: 120px;
        }

        .social-icons a {
            color: white;
            font-size: 15px;
            text-decoration: none;

            transition: opacity 0.2s ease;
        }

        .social-icons a:hover {
            opacity: 0.7;
        }


        /* =========================================
       MIDDLE TOP COLUMN
       ========================================= */

        .top-middle {
            color: white;
            font-family: Arial, Helvetica, sans-serif;
            font-size: 14px;
            text-align: center;
            line-height: 1.5;
        }

        .top-middle a {
            color: white;
            text-decoration: none;
        }

        .top-middle a:hover {
            text-decoration: underline;
        }


        /* =========================================
       RIGHT TOP COLUMN
       ========================================= */

        .top-right-links {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 20px;

            font-size: 13px;
        }

        .top-right-links a {
            color: white;
            text-decoration: none;
            white-space: nowrap;
        }

        .top-right-links a:hover {
            text-decoration: underline;
        }


        /* =========================================
       SECOND TOP DIV
       ========================================= */

        .second-top-div {
            height: 12vh;
            width: 100%;

            display: grid;
            grid-template-columns: 1fr 1fr 1fr;

            
        }

        .second-column {
            display: flex;
            align-items: center;
            justify-content: center;

            
            min-height: 0;
            overflow: hidden;
        }

        .second-column:last-child {
            border-right: none;
        }

        .search-column {
            gap: 10px;
            font-size: 13px;
            color: #222;
        }

        .search-column i {
            font-size: 14px;
        }

        .arova-logo {
            width: 40%;
            height: auto;
            object-fit: contain;
        }

        .account-cart {
            gap: 25px;
            font-size: 13px;
        }

        .account-cart a {
            color: #222;
            text-decoration: none;
        }

        .account-cart a:hover {
            text-decoration: underline;
        }

        .account-cart i {
            margin-left: 6px;
            font-size: 14px;
        }


        /* =========================================
       THIRD TOP DIV
       ========================================= */

        .third-top-div {
            height: 8vh;
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            
        }

        /* =========================================
        MAIN NAVIGATION
        ========================================= */

        .main-nav {
            width: 100%;

            display: flex;
            align-items: center;
            justify-content: center;

            gap: 32px;

            font-size: 14px;
        }

        .main-nav a {
            color: #222;
            text-decoration: none;
            white-space: nowrap;
        }

        .main-nav a:hover {
            text-decoration: underline;
        }


        /* =========================================
       MAIN CONTENT
       ========================================= */

        .main-content {
            width: 100%;
            flex: 1;
            position: relative;

            display: flex;
            align-items: stretch;
            justify-content: center;

            padding: 40px;
            overflow: hidden;
        }

        .slideshow {
            position: relative;
            width: 100%;
            flex: 1;
            overflow: hidden;

        }

        .slide {
            position: absolute;
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .slide-hadley {
            left: 0;
        }

        .slide-nola {
            left: 0;
            opacity: 0;
        }

        /* =========================================
       TEMPORARY DEVELOPMENT LABELS
       ========================================= */

        .demo-notice {
            position: absolute;

            top: 50%;
            left: 50%;

            width: 60%;

            background: orange;
            color: blue;

            text-align: center;
            font-family: 'Lato', sans-serif;
            font-size: 18px;
            font-weight: 400;

            padding: 8px 0;

            transform: translate(-50%, -50%) rotate(-45deg);

            z-index: 10;
        }

        .label {
            font-size: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
            color: #888;
        }

        .hamburger {
            display: none;
        }

        #R3F-app {
            width: 100%;
            height: 100%;
            min-height: 0;
            overflow: visible;

            
        }

        #R3F-app canvas {
            display: block;
            width: 100% !important;
            height: 100% !important;

            
        }

        @media (max-width: 768px) {

            .top-div .social-icons,
            .top-div .top-right-links {
                display: none;
            }

            .top-div {
                grid-template-columns: 1fr;
            }

            .second-top-div {
                height: 60px;
            }

            .third-top-div {
                display: none;
            }

            .search-column span {
                display: none;
            }

            .hamburger {
                display: block;
                position: absolute;
                left: 20px;
            }

        }
    </style>

</head>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>

    <script>

        const tl = gsap.timeline({
            repeat: -1
        });

        tl
            // Show Hadley
            .to(".slide-hadley", {
                opacity: 1,
                duration: 0
            })

            // Hold Hadley
            .to({}, {
                duration: 3
            })

            // Cross-fade to Nola
            .to(".slide-hadley", {
                opacity: 0,
                duration: 1.5
            })
            .to(".slide-nola", {
                opacity: 1,
                duration: 1.5
            }, "<")

            // Hold Nola
            .to({}, {
                duration: 3
            })

            // Cross-fade back to Hadley
            .to(".slide-nola", {
                opacity: 0,
                duration: 1.5
            })
            .to(".slide-hadley", {
                opacity: 1,
                duration: 1.5
            }, "<");
    </script>
